services:
  browser:
    image: mcr.microsoft.com/playwright:v1.62.0-noble
    ipc: host
    working_dir: /workspace
    environment:
      CI: "true"
    volumes:
      - .:/workspace
      # Anonymous volumes make every invocation a cold dependency install and
      # keep Linux pnpm metadata out of the host worktree.
      - /workspace/client/node_modules
      - /workspace/.pnpm-store
    command:
      - bash
      - -lc
      - >-
        corepack enable &&
        corepack prepare pnpm@11.15.1 --activate &&
        pnpm --dir client install --frozen-lockfile &&
        cd client &&
        VITE_GAME_UI_PERFORMANCE=0 node_modules/.bin/vitest run --config vitest.browser.config.ts &&
        VITE_GAME_UI_PERFORMANCE=1 node_modules/.bin/vitest run --config vitest.browser.config.ts
        test/game-ui-screens-browser.test.ts --testNamePattern 'observable 20 Hz / 10 Hz screen budget'
