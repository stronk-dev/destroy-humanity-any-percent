services:
  browser:
    image: mcr.microsoft.com/playwright:v1.62.0-noble
    ipc: host
    working_dir: /workspace
    environment:
      CI: "true"
    volumes:
      - .:/workspace
      # Anonymous volumes make every invocation a cold dependency install and
      # keep Linux pnpm metadata out of the host worktree.
      - /workspace/client/node_modules
      - /workspace/.pnpm-store
    command:
      # Match the hosted browser job's existing ten-minute containment ceiling.
      # Kill the disposable test process group even if a runner ignores TERM.
      - timeout
      - --verbose
      - --signal=KILL
      - 10m
      - bash
      - -lc
      - >-
        apt-get update &&
        apt-get install -y --no-install-recommends make &&
        corepack enable &&
        corepack prepare pnpm@11.15.1 --activate &&
        pnpm --dir client install --frozen-lockfile &&
        make test-browser
