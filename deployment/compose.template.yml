name: cloud-clicker

x-postgres-image: &postgres-image "@@POSTGRES_IMAGE@@"

services:
  caddy:
    image: "@@CADDY_IMAGE@@"
    restart: unless-stopped
    environment:
      CLOUD_CLICKER_PUBLIC_ORIGIN: "${CLOUD_CLICKER_PUBLIC_ORIGIN:?set the canonical HTTPS origin}"
    ports:
      - "${CLOUD_CLICKER_HTTP_PORT:-80}:80"
      - "${CLOUD_CLICKER_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, application]
    depends_on:
      gameserver:
        condition: service_started
    logging:
      driver: journald
      options:
        tag: cloud-clicker-caddy

  gameserver:
    image: "@@GAMESERVER_IMAGE@@"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    environment:
      CLOUD_CLICKER_DEPLOYMENT_MODE: production
      CLOUD_CLICKER_PUBLIC_ORIGIN: "${CLOUD_CLICKER_PUBLIC_ORIGIN:?set the canonical HTTPS origin}"
      CLOUD_CLICKER_TRUSTED_PROXY_HOPS: "1"
      CLOUD_CLICKER_CONTENT_ROOT: /opt/cloud-clicker/content
      CLOUD_CLICKER_SERVER_ID: "${CLOUD_CLICKER_SERVER_ID:?set a canonical UUID}"
      CLOUD_CLICKER_JWT_CURRENT_ID: "${CLOUD_CLICKER_JWT_CURRENT_ID:?set the current JWT key ID}"
      CLOUD_CLICKER_JWT_CURRENT_KEY_FILE: /run/secrets/jwt-current
      CLOUD_CLICKER_BOOTSTRAP_CURRENT_ID: "${CLOUD_CLICKER_BOOTSTRAP_CURRENT_ID:?set the current bootstrap key ID}"
      CLOUD_CLICKER_BOOTSTRAP_CURRENT_KEY_FILE: /run/secrets/bootstrap-current
      DATABASE_URL_FILE: /run/secrets/database-url
      LISTEN_ADDR: :8080
    secrets: [database-url, jwt-current, bootstrap-current]
    expose: ["8080"]
    networks: [application, database]
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: journald
      options:
        tag: cloud-clicker-gameserver

  postgres:
    image: *postgres-image
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-cloud_clicker}"
      POSTGRES_USER: "${POSTGRES_USER:-cloud_clicker}"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets: [postgres-password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ${POSTGRES_USER:-cloud_clicker} -d ${POSTGRES_DB:-cloud_clicker}"]
      interval: 2s
      timeout: 5s
      retries: 30
    logging:
      driver: journald
      options:
        tag: cloud-clicker-postgres

  backup:
    image: *postgres-image
    user: "70:70"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=0700,uid=70,gid=70
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    entrypoint: ["/opt/cloud-clicker/deployment-backup"]
    command:
      - schedule
      - --target=/backups
      - --database-url-file=/run/secrets/database-url
      - --release-manifest=/opt/cloud-clicker/release-manifest.json
      - --epoch=/opt/cloud-clicker/epoch.json
      - --age-recipient=${CLOUD_CLICKER_AGE_RECIPIENT:?set the public age X25519 recipient}
      - --server-id=${CLOUD_CLICKER_SERVER_ID:?set a canonical UUID}
    secrets: [database-url]
    volumes:
      - ./deployment-backup:/opt/cloud-clicker/deployment-backup:ro
      - ./release-manifest.json:/opt/cloud-clicker/release-manifest.json:ro
      - ./content/balance/epochs/phase0.json:/opt/cloud-clicker/epoch.json:ro
      - "${CLOUD_CLICKER_BACKUP_TARGET:?set the separately mounted backup target}:/backups"
    networks: [database]
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: journald
      options:
        tag: cloud-clicker-backup

networks:
  edge: {}
  application:
    internal: true
  database:
    internal: true

volumes:
  caddy_data: {}
  caddy_config: {}
  postgres_data: {}

secrets:
  database-url:
    file: "${CLOUD_CLICKER_DATABASE_URL_SECRET_FILE:?set the database URL secret file}"
  postgres-password:
    file: "${CLOUD_CLICKER_POSTGRES_PASSWORD_SECRET_FILE:?set the Postgres password secret file}"
  jwt-current:
    file: "${CLOUD_CLICKER_JWT_CURRENT_SECRET_FILE:?set the current JWT secret file}"
  bootstrap-current:
    file: "${CLOUD_CLICKER_BOOTSTRAP_CURRENT_SECRET_FILE:?set the current bootstrap secret file}"
