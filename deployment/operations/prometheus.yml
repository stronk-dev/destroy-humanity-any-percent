global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/cloud-clicker-alerts.yml

scrape_configs:
  - job_name: gameserver
    metrics_path: /metrics
    static_configs:
      - targets: ["gameserver:8080"]
  - job_name: caddy
    metrics_path: /metrics
    static_configs:
      - targets: ["caddy:2020"]
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
